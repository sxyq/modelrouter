<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModelRouter · Laya 训练记录</title><style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--line:#374151;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--good:#34d399;--warn:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"PingFang SC",sans-serif}header{padding:22px 28px;border-bottom:1px solid var(--line)}h1{margin:0 0 6px;font-size:23px}h2{font-size:16px;margin:0 0 14px}main{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;padding:18px 28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.tree button{width:100%;text-align:left;color:var(--text);background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px;cursor:pointer}.tree button.active{background:#243b53;color:#fff}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.card{background:#111827;border:1px solid var(--line);border-radius:8px;padding:12px}.value{font-size:20px;margin-top:5px}.good{color:var(--good)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}svg{width:100%;height:210px;background:#111827;border-radius:8px}.small{font-size:12px;color:var(--muted)}@media(max-width:850px){main{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>ModelRouter · Laya 训练记录</h1><div class="muted" id="updated"></div></header><main><section class="panel tree"><h2>历史节点</h2><div id="tree"></div></section><section><div class="panel"><div class="grid" id="cards"></div><div id="detail"></div></div><div class="panel" style="margin-top:18px"><h2>Epoch 指标</h2><svg id="chart" viewBox="0 0 800 210" preserveAspectRatio="none"></svg><div class="small">曲线显示 S1 Val Loss；空值保持为空。</div><table id="history"></table></div></section></main><script src="data.js"></script><script>
const D=window.LAYA_DATA;const runs=D.runs;let selected='R3';document.getElementById('updated').textContent='最近更新：'+D.generated_at+' · 状态：'+D.status;
function fmt(v){return v===null||v===undefined?'N/A':typeof v==='number'?v.toFixed(4):v}function runName(id){return ({R0:'R0 参考评估',R1:'R1 S1',R2:'R2 S1+S2',R3:'R3 S1+S2+S3'})[id]||id}
function renderTree(){let el=document.getElementById('tree');el.innerHTML='';['R0','R1','R2','R3'].forEach(id=>{if(!runs[id])return;let b=document.createElement('button');b.textContent=runName(id)+' · '+runs[id].status;b.className=id===selected?'active':'';b.onclick=()=>{selected=id;render()};el.appendChild(b)})}
function metric(run,group,key){return run.validation&&run.validation[group]?run.validation[group][key]:null}
function render(){renderTree();let r=runs[selected];let s1=metric(r,'S1','accuracy'),s2=metric(r,'S2','accuracy'),s3=metric(r,'S3','accuracy');document.getElementById('cards').innerHTML=[['Run',selected],['状态',r.status],['S1 Accuracy',fmt(s1)],['S2 Accuracy',fmt(s2)],['S3 Accuracy',fmt(s3)],['最佳 Epoch',r.best_epoch||'N/A'],['父节点',r.parent_checkpoint_id||'Laya Base'],['样本量',r.train_groups?Object.values(r.train_groups).reduce((a,b)=>a+b,0):'N/A']].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('');let cfg=r.config||{};document.getElementById('detail').innerHTML='<h2>'+runName(selected)+'</h2><div class="muted">训练配置：'+(cfg.loss||'N/A')+' · max_len '+(cfg.max_len||'N/A')+' · head_max_len '+(cfg.head_max_len||'N/A')+' · micro '+(cfg.micro_batch||'N/A')+' × accum '+(cfg.grad_accum||'N/A')+' · seed '+(r.seed??'N/A')+'</div>'+(r.stop_reason?'<p class="warn">停止原因：'+r.stop_reason+'</p>':'');let hs=r.history||[];document.getElementById('history').innerHTML='<tr><th>节点</th><th>Train Loss</th><th>S1 Loss</th><th>S1 Acc</th><th>S2 Acc</th><th>S3 Acc</th><th>显存峰值 MiB</th></tr>'+hs.map(h=>'<tr><td>'+h.checkpoint_id+'</td><td>'+fmt(h.train_loss)+'</td><td>'+fmt(h.validation.S1?.loss)+'</td><td>'+fmt(h.validation.S1?.accuracy)+'</td><td>'+fmt(h.validation.S2?.accuracy)+'</td><td>'+fmt(h.validation.S3?.accuracy)+'</td><td>'+fmt(h.gpu_memory_peak_mib)+'</td></tr>').join('');draw(hs.map(h=>h.validation.S1?.loss));}
function draw(vals){let svg=document.getElementById('chart');svg.innerHTML='';let nums=vals.filter(v=>typeof v==='number');if(!nums.length)return;let min=Math.min(...nums),max=Math.max(...nums);if(max===min)max=min+1;let pts=vals.map((v,i)=>typeof v==='number'?((i/(vals.length-1||1))*760+20)+','+(190-(v-min)/(max-min)*160):'').filter(Boolean).join(' ');svg.innerHTML='<polyline fill="none" stroke="#60a5fa" stroke-width="3" points="'+pts+'"/>'}
render();
</script></body></html>
