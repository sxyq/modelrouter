<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ModelRouter · Laya Full Matrix</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#1c2738;--line:#34445b;--text:#e8edf5;--muted:#9eacc0;--accent:#63a4ff;--good:#4adeaa;--warn:#f6c453;--bad:#fb7185}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"PingFang SC",sans-serif}
    header{padding:24px 30px;border-bottom:1px solid var(--line)}h1{margin:0 0 7px;font-size:24px}h2{font-size:17px;margin:0 0 14px}
    main{padding:20px 30px;display:grid;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:17px;overflow:auto}
    .grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}.card{background:#121c2b;border:1px solid var(--line);border-radius:8px;padding:12px}.label{color:var(--muted);font-size:12px}.value{font-size:20px;margin-top:6px}.muted{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
    table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}tr.selected{background:#243a55}
    button{color:var(--text);background:#22344d;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}button:hover,button.active{background:#315579}.tree{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tree .base{border-color:var(--good)}
    .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.detail{line-height:1.6}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;color:#c9d7eb}
    .heatmap th,.heatmap td{min-width:72px;text-align:center;font-size:11px}.heatmap td{height:42px;cursor:pointer;border-radius:4px}.heatmap .completed{background:#166b55}.heatmap .early_stopped{background:#6b5a1b}.heatmap .running{background:#285a9c}.heatmap .blocked{background:#4b5260}.heatmap .planned{background:#27364a}.heatmap .cpu_materialized{background:#285a9c}.heatmap .discarded,.heatmap .legacy_input_protocol_discarded{background:#7a3040}.heatmap .failed{background:#7a3040}.matrix-note{margin:7px 0;color:var(--muted);font-size:12px}.protocol-banner{margin-top:10px;padding:10px 12px;border:1px solid var(--warn);border-radius:8px;background:#2b2a1d}.bar{height:8px;background:#26374d;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}
    svg{width:100%;height:230px;background:#121c2b;border-radius:8px}.small{font-size:12px;color:var(--muted)}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(130px,1fr))}.two{grid-template-columns:1fr}}@media(max-width:650px){header,main{padding-left:15px;padding-right:15px}.grid{grid-template-columns:repeat(2,minmax(120px,1fr))}}
  </style>
</head>
<body>
  <header><h1>ModelRouter · Laya Full Matrix</h1><div class="muted" id="updated"></div><div id="protocolBanner" class="protocol-banner"></div></header>
  <main>
    <section class="panel"><h2>实验总览</h2><div class="grid" id="overview"></div></section>
    <section class="panel"><h2>B×C 实验矩阵</h2><div id="matrixCards" class="grid"></div><div class="matrix-note">每格显示状态、已完成 Epoch 和当前可用的验证指标；辅助任务没有 S1 指标时保留为 N/A。</div><table id="matrixTable" class="heatmap"></table></section>
    <section class="two"><div class="panel"><h2>数据覆盖</h2><div id="coverage"></div><svg id="sourceChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div><div class="panel"><h2>Q×P 策略</h2><table id="qpTable"></table></div></section>
    <section class="two"><div class="panel"><h2>协议与 S2 基线</h2><div id="s2Audit" class="detail"></div></div><div class="panel"><h2>计划比例 / 实际 Item</h2><div id="ratioTable"></div><svg id="ratioChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div></section>
    <section class="panel"><h2>当前待执行队列</h2><div id="queue" class="code"></div></section>
    <section class="panel"><h2>所有方案</h2><table id="runs"></table></section>
    <section class="panel"><h2>历史训练树</h2><div id="tree" class="tree"></div><div id="treeDetail" class="detail"></div></section>
    <section class="two">
      <div class="panel"><h2>训练曲线</h2><svg id="lossChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg><div class="small">当前方案的 S1 Val Loss；每个点对应一个真实 Epoch Checkpoint。</div></div>
      <div class="panel"><h2>准确率曲线</h2><svg id="accChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg><div class="small">当前方案的 S1 Accuracy。</div></div>
    </section>
    <section class="two">
      <div class="panel"><h2>运行状态</h2><svg id="statusChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div>
      <div class="panel"><h2>各层记录量</h2><svg id="layerRowsChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div>
    </section>
    <section class="two">
      <div class="panel"><h2>各层独立单位</h2><svg id="layerUnitsChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div>
      <div class="panel"><h2>Q×P 已完成数量</h2><svg id="qpChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div>
    </section>
    <section class="two">
      <div class="panel"><h2>方案耗时</h2><svg id="timeChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div>
      <div class="panel"><h2>显存峰值</h2><svg id="memoryChart" viewBox="0 0 900 230" preserveAspectRatio="none"></svg></div>
    </section>
    <section class="panel"><h2>当前方案详情</h2><div id="detail" class="detail"></div><table id="history"></table></section>
    <section class="panel"><h2>复现信息</h2><div id="repro" class="code"></div></section>
  </main>
  <script src="data.js"></script>
  <script>
    const D=window.LAYA_DATA||{};const runs=D.runs||{};let selected=D.overview?.current_run||Object.keys(runs).find(x=>x==='N10')||Object.keys(runs).filter(x=>x!=='R0').pop()||Object.keys(runs)[0]||'';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=v=>v===null||v===undefined||v===''?'N/A':typeof v==='number'?v.toFixed(4):esc(v);
    const plan=id=>(D.plans||{})[id]||{};const run=id=>runs[id]||{};
    function allIds(){return [...new Set([...Object.keys(D.plans||{}),...Object.keys(runs)])].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));}
    function renderOverview(){const o=D.overview||{},m=D.matrix||{};document.getElementById('updated').textContent='指标更新时间：'+(D.generated_at||'N/A')+' · 同步状态：'+(o.github_sync||o.latest_sync_at||'N/A')+' · 状态：'+(D.status||'N/A');const cards=[['已完成旧方案',o.completed_runs||0],['新协议 CPU 可用',o.cpu_ready_runs||0],['正式选模 Run',o.formal_selection_ready_runs||0],['BLOCKED',o.blocked_runs??m.blocked??0],['理论槽位',o.planned_runs||D.theoretical_slots||0],['Checkpoint 节点',o.checkpoint_total||0],['实际权重目录',o.saved_weight_count||0],['旧输入协议 Run',o.legacy_run_count||0],['S1 Loss 最佳',o.best_s1_loss_checkpoint||'N/A'],['S1 Accuracy 最佳',o.best_s1_accuracy_checkpoint||'N/A']];document.getElementById('overview').innerHTML=cards.map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+esc(x[1])+'</div></div>').join('');const n=D.new_protocol||{};document.getElementById('protocolBanner').innerHTML='<b>当前数据协议：</b>'+esc(n.version||D.protocol_version||'N/A')+' · <b>旧输入：</b>'+esc(n.legacy_warning||'未提供')+' · <b>新协议正式选模：</b>'+esc(o.formal_selection_ready_runs||0)+' 个 Run';}
    function matrixSpec(id){return (D.plans||{})[id]||{}}
    function matrixRun(id){return runs[id]||{}}
    function matrixCell(id){const p=matrixSpec(id),r=matrixRun(id),h=(r.history||[]).find(x=>x.epoch===r.best_epoch)||(r.history||[]).slice(-1)[0]||{},s=h.validation?.S1||{};let st=r.selection_state||r.status||p.status||'PLANNED';return '<td class="'+st.toLowerCase()+'" title="'+esc(JSON.stringify(p))+'" onclick="selectRun(\''+esc(id)+'\')"><b>'+esc(st)+'</b><br><span>'+esc((r.history||[]).length||0)+' ep</span><br><span>'+fmt(s.loss)+'</span></td>'}
    function renderMatrix(){const bs=['B01','B02','B03','B04','B05','B06','B07'],cs=Array.from({length:16},(_,i)=>'C'+String(i+1).padStart(2,'0'));let h='<tr><th>B / C</th>'+cs.map(c=>'<th>'+c+'</th>').join('')+'</tr>';for(const b of bs){h+='<tr><th>'+b+'</th>';for(const c of cs){const oldIds=Object.keys(D.plans||{}).filter(id=>id.startsWith(b+'_'+c+'_'));const newIds=Object.keys(D.plans||{}).filter(id=>id.startsWith('P0_'+b+'_'+c+'_'));const ids=newIds.length?newIds:oldIds;h+=ids.length?matrixCell(ids.find(id=>id.endsWith('_QB_PB'))||ids[0]):'<td class="blocked">N/A</td>'}h+='</tr>'}document.getElementById('matrixTable').innerHTML=h;const p=Object.values(D.plans||{}),done=p.filter(x=>['COMPLETED','EARLY_STOPPED'].includes(x.status)).length,mat=p.filter(x=>x.materialized).length;document.getElementById('matrixCards').innerHTML=[['旧 16 Run','LEGACY_INPUT_PROTOCOL'],['新协议已物化',mat],['已完成旧 Run',done],['新协议 CPU 队列',D.queue?.length||0],['理论槽位',D.theoretical_slots||p.length]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+esc(x[1])+'</div></div>').join('')}
    function renderCoverage(){const c=D.coverage||{};if(!Object.keys(c).length){document.getElementById('coverage').innerHTML='<div class="muted">当前快照未携带覆盖摘要。</div>';return}let h='<table><tr><th>层</th><th>全来源记录</th><th>矩阵来源记录</th><th>合法候选记录</th><th>候选独立单位</th><th>实际去重 Item</th><th>Run 暴露</th></tr>';for(const [k,v] of Object.entries(c)){if(k==='totals')continue;h+='<tr><td>'+esc(k)+'</td><td>'+fmt(v.raw_records)+'</td><td>'+fmt(v.matrix_source_records||0)+'</td><td>'+fmt(v.eligible_candidate_records)+'</td><td>'+fmt(v.eligible_independent_units)+'</td><td>'+fmt(v.actual_encoded_items)+'</td><td>'+fmt(v.run_item_exposure)+'</td></tr>'}if(c.totals)h+='<tr><th>合计</th><th>'+fmt(c.totals.raw_records)+'</th><th>'+fmt(c.totals.matrix_source_records)+'</th><th>'+fmt(c.totals.eligible_candidate_records)+'</th><th>'+fmt(c.totals.eligible_independent_units)+'</th><th>'+fmt(c.totals.dedup_encoded_items)+'</th><th>'+fmt(c.totals.run_item_exposure)+'</th></tr>';const src=D.coverage_detail?.sources||{};if(Object.keys(src).length){h+='<tr><th colspan="7">来源明细（记录 / 合法候选 / 去重 Item）</th></tr>';for(const [k,v] of Object.entries(src)){if(k==='__totals__')continue;h+='<tr><td>'+esc(k)+'</td><td>'+fmt(v.raw_records)+'</td><td>'+fmt(v.matrix_source_records||0)+'</td><td>'+fmt(v.eligible_candidate_records)+'</td><td>'+fmt(v.eligible_independent_units)+'</td><td>'+fmt(v.dedup_encoded_items)+'</td><td>'+fmt(v.run_item_exposure)+'</td></tr>'}}document.getElementById('coverage').innerHTML=h+'</table>';bars('sourceChart',Object.entries(src).filter(([k,v])=>k!=='__totals__'&&(v.actual_encoded_items||v.run_item_exposure)).map(([k,v])=>[k,v.actual_encoded_items||0]),'#4adeaa')}
    function renderQP(){const p=Object.values(D.plans||{}),m={};for(const x of p){if(!x.quality_code)continue;const k=x.quality_code+' × '+x.sampling_code;m[k]=(m[k]||0)+(x.status==='COMPLETED'||x.status==='EARLY_STOPPED'?1:0)}let h='<tr><th>策略</th><th>已完成</th></tr>';for(const [k,v] of Object.entries(m))h+='<tr><td>'+esc(k)+'</td><td>'+v+'</td></tr>';document.getElementById('qpTable').innerHTML=h}
    function renderRuns(){let h='<tr><th>Run</th><th>协议</th><th>数据</th><th>起点</th><th>Seed</th><th>Epoch</th><th>S1 Loss</th><th>S1 Acc</th><th>S1 ECE</th><th>S1 Brier</th><th>S2</th><th>S3</th><th>状态</th></tr>';for(const id of allIds()){const p=plan(id),r=run(id),best=(r.history||[]).find(x=>x.epoch===r.best_epoch)||(r.history||[])[0]||{},s1=best.validation?.S1||{},s2=best.validation?.S2||{},s3=best.validation?.S3||{},legacy=r.legacy_input_protocol||p.legacy_input_protocol;h+='<tr class="'+(id===selected?'selected':'')+'" data-id="'+esc(id)+'"><td><button onclick="selectRun(\''+esc(id)+'\')">'+esc(id)+'</button>'+(r.selection_state?'<div class="small">'+esc(r.selection_state)+'</div>':'')+'</td><td>'+esc(legacy?'LEGACY_INPUT':'P0_NEUTRAL')+'</td><td>'+esc(JSON.stringify(r.train_groups||p.data||{}))+'</td><td>'+esc(r.train_origin||p.train_origin||'Base')+'</td><td>'+fmt(r.seed??p.seed)+'</td><td>'+esc(r.history?.length||p.status||'N/A')+'</td><td>'+fmt(s1.loss)+'</td><td>'+fmt(s1.accuracy)+'</td><td>'+fmt(s1.ece)+'</td><td>'+fmt(s1.brier)+'</td><td>'+fmt(s2.accuracy)+'</td><td>'+fmt(s3.accuracy)+'</td><td>'+esc(r.selection_state||r.status||p.status||'planned')+'</td></tr>'}document.getElementById('runs').innerHTML=h;}
    function renderTree(){let h='<button class="base">Base</button>';for(const id of allIds()){const r=run(id),parent=r.parent_checkpoint_id||'Base';h+='<button class="'+(id===selected?'active':'')+'" onclick="selectRun(\''+esc(id)+'\')">'+esc(id)+' · '+esc(r.status||plan(id).status||'planned')+' · parent '+esc(parent)+'</button>'}document.getElementById('tree').innerHTML=h;document.getElementById('treeDetail').textContent='根节点为 Base；每个方案显示其真实 parent_checkpoint_id，续训方案不会被串成虚构链条。';}
    function renderS2(){const a=D.s2_audit||{};let h='<p>只计算类别多数基线，未调用模型推理。</p>';for(const sp of ['train','val']){const x=a[sp]||{};h+='<p><b>'+sp+'</b>：0/1='+esc(JSON.stringify(x.exposure_label_counts||{}))+'，多数类='+esc(x.majority_label??'N/A')+'，Accuracy='+fmt(x.majority_accuracy)+'，Balanced Accuracy='+fmt(x.majority_balanced_accuracy)+'，Macro-F1='+fmt(x.majority_macro_f1)+'</p>'}const pa=D.protocol_audit||{};h+='<p class="small">新版指令行：'+fmt(pa.new_instruction_rows)+'；旧目标指令：'+fmt(pa.old_instruction_rows)+'；指令中出现目标名：'+fmt(pa.target_name_in_instruction)+'；S2 可信状态：'+esc(D.s2_status||'待审查')+'</p>';document.getElementById('s2Audit').innerHTML=h;}
    function renderRatio(){const a=D.ratio_comparison||[];let h='<table><tr><th>Run</th><th>计划</th><th>实际 Item</th><th>实际比例</th><th>独立单位</th><th>重复采样</th></tr>';for(const x of a)h+='<tr><td>'+esc(x.run_id)+'</td><td>'+esc(JSON.stringify(x.planned_ratios||{}))+'</td><td>'+esc(JSON.stringify(x.actual_item_counts||{}))+'</td><td>'+esc(JSON.stringify(x.actual_item_ratios||{}))+'</td><td>'+esc(JSON.stringify(x.actual_independent_units||{}))+'</td><td>'+esc(JSON.stringify(x.repeated_sampling_by_target||{}))+'</td></tr>';document.getElementById('ratioTable').innerHTML=h+'</table>';bars('ratioChart',a.slice(0,16).map(x=>[x.run_id,Number(x.effective_optimization_items)||0]),'#a78bfa');}
    function renderQueue(){const q=D.queue||[];document.getElementById('queue').textContent=JSON.stringify({ready_for_cpu_validation:q,formal_selection_ready_runs:D.overview?.formal_selection_ready_runs||0,discarded:D.discarded_runs||[]},null,2);}
    function renderDetail(){const r=run(selected),p=plan(selected),cfg=r.config||{};document.getElementById('detail').innerHTML='<h3>'+esc(selected||'N/A')+'</h3><p>状态：'+esc(r.selection_state||r.status||p.status||'planned')+' · 协议：'+esc(r.protocol_version||p.protocol_version||'legacy')+' · B/C/Q/P：'+esc([r.batch_id||p.batch_id,r.combo_id||p.combo_id,r.quality_code||p.quality_code,r.sampling_code||p.sampling_code].join(' / '))+' · 起点：'+esc(r.train_origin||p.train_origin||'Base')+' · 父 Checkpoint：'+esc(r.parent_checkpoint_id||'Base')+' · Seed：'+fmt(r.seed??p.seed)+'</p><p>训练组：'+esc(JSON.stringify(r.train_groups||p.data||{}))+' · Val 组：'+esc(JSON.stringify(r.val_groups||{}))+'</p><p>Loss：'+esc(cfg.loss||'N/A')+' · Encoder LR：'+fmt(cfg.encoder_lr)+' · Head LR：'+fmt(cfg.head_lr)+' · micro/accum：'+esc((cfg.micro_batch??'N/A')+'/'+(cfg.grad_accum??'N/A'))+' · max_len/head：'+esc((cfg.max_len??'N/A')+'/'+(cfg.head_max_len??'N/A'))+'</p>'+(r.selection_reason?'<p class="warn">队列标记：'+esc(r.selection_reason)+'</p>':'')+(r.stop_reason?'<p class="warn">停止原因：'+esc(r.stop_reason)+'</p>':'');let hs=r.history||[];let h='<tr><th>节点</th><th>Train Loss</th><th>S1 Loss</th><th>S1 Acc</th><th>S1 ECE</th><th>S1 Brier</th><th>S2 Acc</th><th>S3 Acc</th><th>更新步数</th><th>Train s</th><th>Val s</th><th>Save s</th><th>总 s</th><th>显存 MiB</th><th>GPU %</th><th>权重</th></tr>';for(const e of hs){const s1=e.validation?.S1||{},s2=e.validation?.S2||{},s3=e.validation?.S3||{};h+='<tr><td>'+esc(e.checkpoint_id)+'</td><td>'+fmt(e.train_loss)+'</td><td>'+fmt(s1.loss)+'</td><td>'+fmt(s1.accuracy)+'</td><td>'+fmt(s1.ece)+'</td><td>'+fmt(s1.brier)+'</td><td>'+fmt(s2.accuracy)+'</td><td>'+fmt(s3.accuracy)+'</td><td>'+esc(e.optimizer_updates??'N/A')+'</td><td>'+fmt(e.train_seconds)+'</td><td>'+fmt(e.validation_seconds)+'</td><td>'+fmt(e.checkpoint_seconds)+'</td><td>'+fmt(e.epoch_total_seconds)+'</td><td>'+fmt(e.gpu_memory_peak_mib)+'</td><td>'+fmt(e.gpu_utilization_percent)+'</td><td>'+esc(e.weights_saved?'saved':'N/A')+'</td></tr>'}document.getElementById('history').innerHTML=h||'<tr><td>暂无 Epoch</td></tr>';}
    function draw(id,values,color){const svg=document.getElementById(id);svg.innerHTML='';const nums=values.filter(v=>typeof v==='number');if(!nums.length)return;let min=Math.min(...nums),max=Math.max(...nums);if(max===min)max=min+1;const pts=values.map((v,i)=>typeof v==='number'?((i/(values.length-1||1))*850+25)+','+(205-(v-min)/(max-min)*175):'').filter(Boolean).join(' ');svg.innerHTML='<polyline fill="none" stroke="'+color+'" stroke-width="3" points="'+pts+'"/>'}
    function bars(id,entries,color){const svg=document.getElementById(id);if(!entries.length){svg.innerHTML='';return}const max=Math.max(1,...entries.map(x=>Number(x[1])||0)),w=850/entries.length;let h='<line x1="25" y1="205" x2="875" y2="205" stroke="#34445b"/>';entries.forEach((x,i)=>{const v=Number(x[1])||0,bh=160*v/max,xp=25+i*w+w*.15;h+='<rect x="'+xp.toFixed(1)+'" y="'+(205-bh).toFixed(1)+'" width="'+(w*.7).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+color+'"/><text x="'+(xp+w*.35).toFixed(1)+'" y="'+(198-bh).toFixed(1)+'" text-anchor="middle" fill="#e8edf5" font-size="11">'+esc(fmt(v))+'</text><text x="'+(xp+w*.35).toFixed(1)+'" y="222" text-anchor="middle" fill="#9eacc0" font-size="11">'+esc(x[0])+'</text>'});svg.innerHTML=h}
    function renderCharts(){const hs=run(selected).history||[];draw('lossChart',hs.map(x=>x.validation?.S1?.loss),'#63a4ff');draw('accChart',hs.map(x=>x.validation?.S1?.accuracy),'#4adeaa');const p=Object.values(D.plans||{}),r=Object.values(runs);const status={};for(const x of p)status[x.status||'PLANNED']=(status[x.status||'PLANNED']||0)+1;for(const x of r){const k=x.status||'RUNNING';if(status[k]===undefined)status[k]=0;status[k]++}bars('statusChart',Object.entries(status),'#63a4ff');const cov=D.coverage||{};bars('layerRowsChart',Object.entries(cov).filter(([k])=>k!=='totals').map(([k,v])=>[k,v.raw_records]),'#4adeaa');bars('layerUnitsChart',Object.entries(cov).filter(([k])=>k!=='totals').map(([k,v])=>[k,v.eligible_independent_units]),'#f6c453');const qp={};for(const x of r){const k=[x.quality_code,x.sampling_code].join(' × ');if(k!==' × ')qp[k]=(qp[k]||0)+1}bars('qpChart',Object.entries(qp),'#a78bfa');const timings=r.map(x=>[x.run_id||'run',((x.history||[]).reduce((a,e)=>a+(Number(e.epoch_total_seconds)||0),0))]).filter(x=>x[1]>0).slice(-16);bars('timeChart',timings,'#fb7185');const memory=r.map(x=>[x.run_id||'run',Math.max(0,...(x.history||[]).map(e=>Number(e.gpu_memory_peak_mib)||0))]).filter(x=>x[1]>0).slice(-16);bars('memoryChart',memory,'#38bdf8');}
    function renderRepro(){const r=run(selected),p=plan(selected);document.getElementById('repro').textContent=JSON.stringify({experiment_id:D.experiment_id,run_id:selected,plan:p,run:{status:r.status,parent_checkpoint_id:r.parent_checkpoint_id,config:r.config,train_groups:r.train_groups,val_groups:r.val_groups,history:r.history},code_commit:D.code_commit,fixed_validation:D.fixed_validation,checkpoint_root:r.checkpoint_root},null,2);}
    function selectRun(id){selected=id;render()}function render(){renderOverview();renderMatrix();renderCoverage();renderQP();renderS2();renderRatio();renderQueue();renderRuns();renderTree();renderDetail();renderCharts();renderRepro()}render();
  </script>
